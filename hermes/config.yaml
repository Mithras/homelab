# P1
#   ~ browser
#   - email
# P2
#   - mcp: linkedin
#   - pdf

_config_version: 51
terminal:
  # ssh -p 2222 -i /opt/data/.ssh/id_rsa -o UserKnownHostsFile=/opt/data/.ssh/known_hosts hermes@sandbox-mithras
  # ssh -p 2222 -i /opt/data/.ssh/id_rsa -o UserKnownHostsFile=/opt/data/.ssh/known_hosts hermes@sandbox-dina
  backend: ssh
  file_sync_enabled: false
platforms:
  telegram:
    extra:
      ignore_root_dm: true
      dm_topic_auto_transfer: true
      group_allow_admin_from: ["499285727"]
      group_user_allowed_commands: ["status"]
telegram:
  reactions: true
display:
  interface: tui
  busy_input_mode: steer # interrupt | queue | steer
  streaming: true
  platforms:
    telegram:
      streaming: false # `true` causes duplicated/intemediate messages
kanban:
  max_in_progress: 2
skills:
  create_dir: /opt/data/skills-custom
plugins:
  enabled:
    - hermes-lcm
browser:
  cdp_url: ws://localhost:9222
# agent:
#   enabled_toolsets: []
#   disabled_toolsets: []
memory:
  # provider: openviking
  memory_char_limit: 5000
  user_char_limit: 2500
context:
  engine: lcm
session_reset:
  mode: none
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
    # - homeassistant
    # - image_gen
    # - kanban
  telegram:
    - browser
    - clarify
    - code_execution
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
    # - homeassistant
    # - image_gen
    # - kanban
  cron:
    - browser
    - file
    - terminal
    - web
    # - kanban
security:
  allow_lazy_installs: false
approvals:
  mode: smart # manual | smart
  destructive_slash_confirm: false
timezone: America/Los_Angeles
onboarding:
  seen:
    busy_input_prompt: true
compression:
  context_total_ceiling_seconds: 1800

model:
  default: primary
  provider: litellm
providers:
  litellm:
    api: http://litellm:4000
    name: litellm
    api_key: ${LITELLM_API_KEY}
    models:
      primary:
        context_length: 262144
        supports_vision: true
      secondary:
        context_length: 262144
        supports_vision: true
    default_model: primary
auxiliary:
  vision:
    provider: litellm
    model: primary
  compression:
    provider: litellm
    model: secondary
    # extra_body:
    #   reasoning_effort: none  # vllm adds `chat_template_kwargs.enable_thinking = false`
  title_generation:
    provider: litellm
    model: secondary
web:
  backend: firecrawl
  keyless_fallback: false
tts:
  provider: openai
  openai:
    model: speaches-ai/Kokoro-82M-v1.0-ONNX
    voice: af_heart
    speed: 1.25
    base_url: http://192.168.1.2:8001/v1
    api_key: none
stt:
  enabled: true
  provider: openai
  openai:
    model: istupakov/parakeet-tdt-0.6b-v3-onnx
    base_url: http://192.168.1.2:8001/v1
    api_key: none
moa:
  default_preset: default
  presets:
    default:
      enabled: true
      aggregator:
        provider: litellm
        model: primary
      reference_models:
        - provider: litellm
          model: secondary
      fanout: user_turn  # per_iteration | every_n:XXX | user_turn
      # reference_max_tokens: XXX
  save_traces: true
