  - title: TensorFold
    path: tensorfold
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: tile
            entity: sensor.tensorfold_running_requests
            name: Running
            icon: mdi:engine
          - type: tile
            entity: sensor.tensorfold_acceptance_length
            name: Acceptance length
            icon: mdi:check-decagram
          - type: tile
            entity: sensor.tensorfold_current_pp
            name: PP now
            icon: mdi:fast-forward
          - type: tile
            entity: sensor.tensorfold_current_tg
            name: TG now
            icon: mdi:speedometer
      - type: grid
        cards:
          - type: tile
            entity: sensor.tensorfold_average_pp
            name: Average PP (effective)
            icon: mdi:average
          - type: tile
            entity: sensor.tensorfold_average_tg
            name: Average TG
            icon: mdi:trending-up
          - type: tile
            entity: sensor.tensorfold_ttft_average
            name: TTFT avg
          - type: tile
            entity: sensor.tensorfold_e2e_latency_average
            name: E2E avg
      - type: grid
        cards:
          - type: tile
            entity: sensor.tensorfold_finished_requests
            name: Requests
            icon: mdi:counter
          - type: tile
            entity: sensor.tensorfold_prompt_tokens_total
            name: Prompt tokens
            icon: mdi:import
          - type: tile
            entity: sensor.tensorfold_generation_tokens_total
            name: Generation tokens
            icon: mdi:export

      - type: grid
        cards:
          - type: history-graph
            grid_options:
              columns: full
            title: Prompt processing
            hours_to_show: 6
            entities:
              - entity: sensor.tensorfold_current_pp
                name: Current PP (effective)
                color: '#fb8c00'
      - type: grid
        cards:
          - type: history-graph
            grid_options:
              columns: full
            title: Token generation
            hours_to_show: 6
            entities:
              - entity: sensor.tensorfold_current_tg
                name: Current TG
                color: '#43a047'
      - type: grid
        cards:
          - type: history-graph
            grid_options:
              columns: full
            title: Percentages
            hours_to_show: 6
            entities:
              - entity: sensor.tensorfold_pool_occupancy
                name: Cache occupancy (max stream)
                color: '#00bcd4'
              - entity: sensor.tensorfold_spec_acceptance
                name: Spec acceptance
                color: '#ab47bc'
      - type: grid
        cards:
          - type: history-graph
            grid_options:
              columns: full
            title: Power
            hours_to_show: 6
            entities:
              - entity: sensor.smart_plug_05_power
              - entity: sensor.smart_plug_06_power
      - type: grid
        cards:
          - type: statistics-graph
            grid_options:
              columns: full
            title: Energy
            entities:
              - entity: sensor.smart_plug_05_energy
              - entity: sensor.smart_plug_06_energy
            days_to_show: 30
            chart_type: bar
            stat_types:
              - sum
              - change
            period: day
